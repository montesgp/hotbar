<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hotbar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      The crescent wraps the panel and the bar column together, mirroring the
      WPF structure where one rounded Border held both Grid columns. The right
      edge stays flat against the monitor; the left edge is the bulge.
    -->
    <main id="bar" class="bar" data-tauri-drag-region>
      <aside id="panel" class="panel" hidden>
        <div id="panel-body" class="panel-body"></div>
      </aside>

      <div class="bar-col" data-tauri-drag-region>
        <button
          id="collapse"
          class="collapse"
          title="Collapse the bar"
          data-tauri-drag-region="false"
        >
          &#8250;
        </button>
        <div id="cells" class="cells"></div>
      </div>

      <!-- Only painted in the collapsed state; the chevron flips direction. -->
      <button id="tab" class="tab" title="Expand the bar" data-tauri-drag-region="false">
        &#8248;
      </button>
    </main>
  </body>
</html>
