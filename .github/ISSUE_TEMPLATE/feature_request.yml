name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and who runs into it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What Orbitbar should do. Describe the behavior, not the code.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
      description: Platform differences, privacy, configuration, anything still undecided.
    validations:
      required: false
