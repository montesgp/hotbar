<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbitbar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      Two independent shapes side by side, unlike the WPF original's single
      Border: the crescent silhouette belongs to the 72px bar alone (`#bar`,
      clipped to its own border-radius), and the panel is its own lightly
      rounded rectangular card immediately to its left. Nesting the panel
      inside the bar's `overflow: hidden` crescent clips wide content (long
      project paths, the window-select text) against the curve instead of
      the panel's own straight edge.
    -->
    <aside id="panel" class="panel" hidden>
      <button
        id="panel-close"
        class="panel-close"
        title="Close panel"
        aria-label="Close panel"
        data-tauri-drag-region="false"
      >
        &#10005;
      </button>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <main id="bar" class="bar" data-tauri-drag-region>
      <div class="bar-col" data-tauri-drag-region>
        <button
          id="collapse"
          class="collapse"
          title="Collapse the bar"
          data-tauri-drag-region="false"
        >
          &#8250;
        </button>
        <div id="cells" class="cells"></div>
      </div>

      <!-- Only painted in the collapsed state; the chevron flips direction. -->
      <button id="tab" class="tab" title="Expand the bar" data-tauri-drag-region="false">
        &#8249;
      </button>
    </main>

    <!--
      Right-click menu (bar + collapsed tab). Rendered by main.ts, styled
      with the same --ob-* tokens as .panel — the OS/WebView2 context menu is
      suppressed app-wide, this is the only one. `position: fixed` in
      styles.css so it can sit in the extra width the window grows for it
      instead of being clipped by the bar's own crescent overflow.
    -->
    <div
      id="context-menu"
      class="context-menu"
      role="menu"
      hidden
      data-tauri-drag-region="false"
    ></div>
  </body>
</html>
